[project]
name = "unitakip"
version = "0.1.0"
description = "Bartın Üniversitesi platformları (Sanal Öğrenme, Öğreniyorum.net, ÜBYS) için saatlik takip ve Gmail bildirim sistemi"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "cryptography>=42",
  "beautifulsoup4>=4.12",
  "playwright>=1.48",
  "google-api-python-client>=2.130",
  "google-auth>=2.30",
  "google-auth-oauthlib>=1.2",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
unitakip = "unitakip.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unitakip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
# Testlerdeki geçici :memory: veritabanları (üretim kodu App.close ile kapatır)
filterwarnings = ["ignore:unclosed database:ResourceWarning"]
